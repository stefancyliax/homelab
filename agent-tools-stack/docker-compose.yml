## Agent Tools Stack
# Runs on agent-tools-node (vault). Services are added one at a time, see docs/services.md.

services:

  parakeet:
    image: ghcr.io/achetronic/parakeet:latest
    container_name: parakeet
    restart: unless-stopped
    ports:
      - 8000:5092

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  nocodb_data:
