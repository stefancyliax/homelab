## Services Stack

services:

  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:latest
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN # Required for fuse mounts handling by restic
    ports:
      - "4096:4096"
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      - TZ=UTC
      # - BASE_URL=https://zerobyte.home.stefancyliax.de
      - BASE_URL=http://10.1.23.224:4096 
      - APP_SECRET=${ZEROBYTE_APP_SECRET} # Ensure this is passed securely via Dockhand environments!
      - WEBHOOK_ALLOWED_ORIGINS=http://10.1.23.184:2586
    command: ["sh", "-c", "mkdir -p /root/.config/rclone && cp /etc/rclone/rclone.conf.ro /root/.config/rclone/rclone.conf && exec bun .output/server/index.mjs"]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - zerobyte_data:/var/lib/zerobyte
      - /etc/rclone/rclone.conf:/etc/rclone/rclone.conf.ro:ro
      # TODO: Mount the host directories you actually want backed up as read-only below.
      - /mnt/data:/mnt/data:ro

  grimmory:
    image: grimmory/grimmory:latest
    container_name: grimmory
    restart: unless-stopped
    depends_on:
      grimmory-db:
        condition: service_healthy
    ports:
      - "6060:6060"
    environment:
      - USER_ID=1000
      - GROUP_ID=100
      - TZ=Europe/Berlin
      - DATABASE_URL=jdbc:mariadb://grimmory-db:3306/grimmory
      - DATABASE_USERNAME=grimmory
      - DATABASE_PASSWORD=${GRIMMORY_DB_PASSWORD}
      - DISK_TYPE=LOCAL
    volumes:
      - grimmory_data:/app/data
      - /mnt/data/grimmory/books:/books
      - /mnt/data/grimmory/bookdrop:/bookdrop
    healthcheck:
      test: wget -q -O - http://localhost:6060/api/v1/healthcheck
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 10s

  grimmory-db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: grimmory-db
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Berlin
      - MYSQL_ROOT_PASSWORD=${GRIMMORY_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=grimmory
      - MYSQL_USER=grimmory
      - MYSQL_PASSWORD=${GRIMMORY_DB_PASSWORD}
    volumes:
      - grimmory_mariadb:/config
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zerobyte_data:
  grimmory_data:
  grimmory_mariadb:
