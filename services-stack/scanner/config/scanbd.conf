# scanbd.conf — Scanner Button Daemon Configuration
# HP ScanJet Pro 2600 f1
#
# Button-to-action mapping:
#   scan   button → Simplex scan (color mode from toggle)
#   copy   button → Duplex scan  (color mode from toggle)
#   email  button → Simplex Grayscale scan
#   pdf    button → Duplex Grayscale scan
#
# To discover which buttons your scanner exposes:
#   docker exec scanner test-buttons
#
# To toggle between Color and Grayscale default mode:
#   docker exec scanner toggle-color
#
# Adjust the 'filter' regex in each action to match
# your scanner's actual SANE option names.
# Run 'docker exec scanner scanbd -d7 -f' to debug button detection.

global {
    debug   = true
    debug-level = 2

    # Run as root inside the container (USB device access)
    user    = root
    group   = root

    # scanbd's own SANE config (for button polling)
    saned     = "/usr/sbin/saned"
    saned_opt = {}
    saned_env = { "SANE_CONFIG_DIR=/etc/scanbd/sane.d" }

    scriptdir = /etc/scanbd/scripts
    timeout   = 500     # polling interval in ms
    pidfile   = "/var/run/scanbd.pid"

    # Environment variables passed to action scripts
    environment {
        device = "SCANBD_DEVICE"
        action = "SCANBD_ACTION"
    }

    multiple_actions = true

    # ──────────────────────────────────────────────
    #  Button Actions
    # ──────────────────────────────────────────────
    # Each action monitors a SANE option (filter regex) for
    # value changes. When the value transitions from 0→1,
    # the script is executed with SCANBD_ACTION set to
    # the action name.
    #
    # The scan.sh script reads SCANBD_ACTION to decide:
    #   scan/email → simplex    |  copy/pdf/fax → duplex
    #   scan/copy  → color mode |  email/pdf    → grayscale
    # ──────────────────────────────────────────────

    # Scan button → Simplex, current color mode
    action scan {
        filter = "^scan"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Simplex scan (current color mode)"
        script = "scan.sh"
    }

    # Copy button → Duplex, current color mode
    action copy {
        filter = "^copy"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Duplex scan (current color mode)"
        script = "scan.sh"
    }

    # Email button → Simplex, Grayscale
    action email {
        filter = "^email"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Simplex Grayscale scan"
        script = "scan.sh"
    }

    # PDF button → Duplex, Grayscale
    action pdf {
        filter = "^pdf"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Duplex Grayscale scan"
        script = "scan.sh"
    }

    # Fax button → Duplex, current color mode (fallback mapping)
    action fax {
        filter = "^fax"
        numerical-trigger {
            from-value = 0
            to-value   = 1
        }
        desc   = "Duplex scan (current color mode)"
        script = "scan.sh"
    }
}
