name: Check NixOS Configuration
on:
  push:
    branches: [ main ]
    paths:
      - 'NixOS/**'
  pull_request:
    paths:
      - 'NixOS/**'

jobs:
  check:
    runs-on: [ self-hosted, nixos ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Evaluate all nodes
        # Evaluates every node to catch syntax errors and missing packages; one at a time,
        # because a single `nix flake check` outgrows the runner's memory
        run: ./NixOS/check-nodes.sh

      - name: Notify ntfy on failure
        if: failure()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          curl -s \
            -H "Title: ❌ Nix Build failed" \
            -H "Tags: x" \
            -H "Priority: high" \
            -d "Commit: $COMMIT_MSG (${{ github.sha }})
          Error: evaluating the nodes failed. Check GitHub Actions logs for details." \
            http://10.1.23.184:2586/homelab-deployments
