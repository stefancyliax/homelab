## Storage Stack
# Runs on storage-node (vault). Services are added one at a time, see docs/services.md.

services:

  nextexplorer:
    image: nxzai/explorer:latest
    container_name: nextexplorer
    restart: unless-stopped
    ports:
      - '3001:3000'
    volumes:
      - nextexplorer_config:/config
      - nextexplorer_cache:/cache
      # Each /mnt/<Label> mount becomes a top-level volume in the UI
      - /mnt/data:/mnt/Files
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=https://nextexplorer.home.stefancyliax.de
      - AUTH_MODE=oidc
      - OIDC_ENABLED=true
      - OIDC_ISSUER=https://auth.home.stefancyliax.de
      - OIDC_CLIENT_ID=nextexplorer
      - OIDC_CLIENT_SECRET=${NEXTEXPLORER_CLIENT_SECRET}
      - OIDC_SCOPES=openid profile email groups
      - OIDC_AUTO_CREATE_USERS=true
      - OIDC_ADMIN_GROUPS=admins

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    # UHD 770 render node for QuickSync (see docs/proxmox-setup.md)
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # Sits on the VM disk until the HDDs are passed through
      - /mnt/data/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.home.stefancyliax.de

volumes:
  nextexplorer_config:
  nextexplorer_cache:
  jellyfin_config:
  jellyfin_cache:
