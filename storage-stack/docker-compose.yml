## Storage Stack
# Runs on storage-node (vault). Services are added one at a time, see docs/services.md.

services:

  nextexplorer:
    image: nxzai/explorer:latest
    container_name: nextexplorer
    restart: unless-stopped
    ports:
      - '3001:3000'
    volumes:
      - nextexplorer_config:/config
      - nextexplorer_cache:/cache
      # Each /mnt/<Label> mount becomes a top-level volume in the UI
      - /mnt/data:/mnt/Files
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=https://nextexplorer.home.stefancyliax.de
      - AUTH_MODE=oidc
      - OIDC_ENABLED=true
      - OIDC_ISSUER=https://auth.home.stefancyliax.de
      - OIDC_CLIENT_ID=nextexplorer
      - OIDC_CLIENT_SECRET=${NEXTEXPLORER_CLIENT_SECRET}
      - OIDC_SCOPES=openid profile email groups
      - OIDC_AUTO_CREATE_USERS=true
      - OIDC_ADMIN_GROUPS=admins

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    # UHD 770 render node for QuickSync (see docs/proxmox-setup.md)
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # Media library, on the 2 TB disk for now; moving it later only changes the host path
      - /mnt/backup/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.home.stefancyliax.de

  scanner:
    # HP ScanJet Pro 2600 f1, passed through by USB from vault (see scanner/README.md)
    build: ./scanner
    container_name: scanner
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - SCAN_DPI=300
      - ADF_POLL_INTERVAL=2
      - ADF_LOAD_DELAY=2
    volumes:
      # paperless-consume share on services-node, automounted on the VM.
      # rslave lets the CIFS mount reach the container when it is (re)established after start
      - /mnt/paperless-consume:/output:rslave
      # Whole tree, so the scanner is found on whichever bus and address it gets
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rwm'  # USB device nodes

volumes:
  nextexplorer_config:
  nextexplorer_cache:
  jellyfin_config:
  jellyfin_cache:
