global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['localhost:8428']

  - job_name: 'comin'
    metrics_path: /metrics
    static_configs:
      - targets:
        - '10.1.23.184:4243' # infra node
        - '10.1.23.224:4243' # services node
        - '10.1.23.165:4243' # another-node (test/auxiliary)
        - '10.1.23.216:4243' # hermes-node
        - '10.1.23.247:4243' # gpu worker
        - '10.1.23.16:4243' # runner-node
        - '10.1.23.65:4243' # storage-node
        - '10.1.23.34:4243' # agent-node
        - '10.1.23.12:4243' # agent-tools-node
        - '10.1.23.47:4243' # work-tools-node
        - '10.1.23.122:4243' # frigate-node

  - job_name: 'node_exporter'
    static_configs:
      - targets:
        - '10.1.23.184:9100'
        - '10.1.23.224:9100'
        - '10.1.23.165:9100'
        - '10.1.23.216:9100'
        - '10.1.23.247:9100'
        - '10.1.23.16:9100'
        - '10.1.23.65:9100'
        - '10.1.23.34:9100'
        - '10.1.23.12:9100'
        - '10.1.23.47:9100'
        - '10.1.23.122:9100'
        - '10.1.23.4:9100' # phil (Proxmox host, hardware temperatures)
        - '10.1.23.3:9100' # vault (Proxmox host, hardware temperatures)

  - job_name: 'docker_daemon'
    static_configs:
      - targets:
        - '10.1.23.184:9323'
        - '10.1.23.224:9323'
        - '10.1.23.165:9323'
        - '10.1.23.216:9323'
        - '10.1.23.247:9323'
        - '10.1.23.16:9323'
        - '10.1.23.65:9323'
        - '10.1.23.34:9323'
        - '10.1.23.12:9323'
        - '10.1.23.47:9323'
        - '10.1.23.122:9323'
