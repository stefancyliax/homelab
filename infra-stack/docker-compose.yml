## Infra Stack

services:

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=10.1.23.184,homepage.home.stefancyliax.de
      - HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET=$PROXMOX_API_SECRET
    # ports:
    #   - 3002:3000
    volumes:
      - ./homepage:/app/config # Binds the local declarative YAML files
      - /var/run/docker.sock:/var/run/docker.sock:ro # Allows native Docker stats widgets later

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-promscrape.config.strictParse=false"
      - "-retentionPeriod=36M"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD # Default password, user can change later
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=Remote-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_AUTO_SIGN_UP_ROLE=Admin
      - GF_AUTH_PROXY_HEADERS=Email:Remote-Email,Name:Remote-Name

  authelia:
    image: authelia/authelia
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./authelia:/config
      - /run/agenix/authelia-oidc-hmac:/config/secrets/oidc_hmac:ro
      - /run/agenix/authelia-oidc-rsa:/config/secrets/oidc_rsa.pem:ro
      - /run/agenix/authelia-session-secret:/config/secrets/session_secret:ro
      - /run/agenix/authelia-storage-key:/config/secrets/storage_key:ro
      - /run/agenix/authelia-jwt-secret:/config/secrets/jwt_secret:ro
    environment:
      - TZ=Europe/Berlin
      - X_AUTHELIA_CONFIG_FILTERS=template

  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORKBUN_API_KEY=$PORKBUN_API_KEY
      - PORKBUN_API_SECRET_KEY=$PORKBUN_API_SECRET_KEY
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    restart: unless-stopped
    command: serve
    init: true
    ports:
      - "2586:80"
    volumes:
      - ./ntfy:/etc/ntfy:ro
      - ntfy_cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "-"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  loki:
    image: grafana/loki:3.5
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  victoriametrics_data:
  grafana_data:
  loki_data:
  ntfy_cache:
  caddy_data:
  caddy_config:

networks:
  default:
    name: infra_net
    external: true